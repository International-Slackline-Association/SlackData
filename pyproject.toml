[project]
name = "slackdata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "sqlmodel>=0.0.24",
    "mangum>=0.17",
    # Cognito ID-token verification (slack_data/api/auth.py). The [crypto] extra
    # is not optional for us: without it PyJWT cannot do RS256 at all, and every
    # admin request fails to verify. auth.py imports jwt at module scope, so a
    # missing wheel is a cold-start ImportError, not a degraded feature.
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.11",
]
# Only needed to talk to the real DynamoDB submissions table. The import in
# slack_data/submissions/dynamo.py is lazy precisely so the suite, the local
# server and Cypress all run without it — see submissions/repository.py.
aws = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["slack_data*"]
